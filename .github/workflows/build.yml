name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev aidl
          pip install --upgrade pip
          pip install setuptools==58.0.0 buildozer cython==0.29.33
      - name: Build
        run: yes | buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: aimlock-apk
          path: bin/*.apk