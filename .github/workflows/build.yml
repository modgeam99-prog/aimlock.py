name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev aidl
          pip install --upgrade pip
          pip install setuptools==58.0.0
          pip install buildozer cython==0.29.33
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
      - name: Build
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log | tail -500
        continue-on-error: true
      - name: Show errors
        if: always()
        run: |
          echo "=== TAIL LOG ==="
          tail -100 build.log || true
          echo "=== GREP ERROR ==="
          grep -i "error\|fail\|exception" build.log | tail -50 || true
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aimlock-apk
          path: bin/*.apk
          if-no-files-found: warn
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log